# ConnectomeChronicle local environment.
# One coordinator (authoritative relational state), three shard instances
# (emulated distributed/federated storage) and MongoDB (heterogeneous metadata).
# This emulates a distributed deployment on one machine; it is not a
# multi-institution federation.

x-postgres: &postgres
  image: postgres:16.6
  environment:
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DB: ${POSTGRES_DB}
  shm_size: 512mb
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 5s
    retries: 20
  restart: unless-stopped

services:
  postgres_coordinator:
    <<: *postgres
    container_name: cc_coordinator
    command: >
      postgres -c shared_buffers=1GB -c work_mem=64MB
               -c maintenance_work_mem=512MB -c max_wal_size=4GB
               -c track_io_timing=on
    ports: ["${COORDINATOR_PORT}:5432"]
    volumes: [coordinator_data:/var/lib/postgresql/data]

  postgres_shard_1:
    <<: *postgres
    container_name: cc_shard_1
    command: postgres -c shared_buffers=256MB -c work_mem=32MB
    ports: ["${SHARD1_PORT}:5432"]
    volumes: [shard1_data:/var/lib/postgresql/data]

  postgres_shard_2:
    <<: *postgres
    container_name: cc_shard_2
    command: postgres -c shared_buffers=256MB -c work_mem=32MB
    ports: ["${SHARD2_PORT}:5432"]
    volumes: [shard2_data:/var/lib/postgresql/data]

  postgres_shard_3:
    <<: *postgres
    container_name: cc_shard_3
    command: postgres -c shared_buffers=256MB -c work_mem=32MB
    ports: ["${SHARD3_PORT}:5432"]
    volumes: [shard3_data:/var/lib/postgresql/data]

  mongodb:
    image: mongo:7.0.14
    container_name: cc_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports: ["${MONGO_PORT}:27017"]
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  coordinator_data:
  shard1_data:
  shard2_data:
  shard3_data:
  mongo_data:
